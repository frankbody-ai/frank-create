<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
window.AS_ICON_BASE = '../../assets/icons';
const { TextField, Select, Checkbox, RadioButton, Switch, Box, Stack, Grid } = window.AutoSolutionsOSDesignSystem_27c955;
function Demo(){
  const [on,setOn] = React.useState(true);
  const [off,setOff] = React.useState(false);
  return (
    <Box background="bg-surface" padding="400" borderRadius="300" shadow="100">
      <Grid columns={3} gap="400" align="start">
        <Stack gap="300">
          <TextField label="Workflow name" defaultValue="Invoice triage" helpText="Shown in run history." />
          <TextField label="Webhook URL" defaultValue="htp://hooks" error="Enter a valid https:// URL" />
          <TextField label="Search" icon="magnifying-glass" placeholder="Search and filter" labelHidden />
        </Stack>
        <Stack gap="300">
          <Select label="Trigger" options={['Schedule','Webhook','Manual']} />
          <TextField label="Monthly budget" prefix="A$" suffix="AUD" defaultValue="1,200" />
          <TextField label="Agent prompt" ai multiline rows={2} placeholder="Describe what this agent should do" />
        </Stack>
        <Stack gap="300">
          <Stack gap="200">
            <Checkbox label="Retry failed steps" helpText="Up to 3 attempts, 30s apart." defaultChecked />
            <Checkbox label="Notify owner" indeterminate />
            <Checkbox label="Archive runs" disabled />
          </Stack>
          <Stack gap="200">
            <RadioButton name="mode" label="Run in sandbox" defaultChecked />
            <RadioButton name="mode" label="Run in production" />
          </Stack>
          <Stack direction="inline" gap="400" align="center">
            <Switch label="Active" checked={on} onChange={setOn} />
            <Switch label="Paused" checked={off} onChange={setOff} size="small" />
          </Stack>
        </Stack>
      </Grid>
    </Box>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
