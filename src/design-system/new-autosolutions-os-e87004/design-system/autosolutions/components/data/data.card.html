<!-- @dsCard group="Components" viewport="700x330" name="Data" subtitle="FilterBar + DataTable + Pagination — the resource index shape" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Data</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
window.AS_ICON_BASE = '../../assets/icons';
const { Card, DataTable, FilterBar, Pagination, Badge, Text, Stack, Thumbnail } = window.AutoSolutionsOSDesignSystem_27c955;
const DATA = [
  { id:'wf_1', name:'Invoice triage', status:['success','Active'], owner:'Finance ops', runs:'1,044', fail:'0' },
  { id:'wf_2', name:'Lead enrichment', status:['info','Draft'], owner:'Growth', runs:'318', fail:'2' },
  { id:'wf_3', name:'Contract summariser', status:['critical','Failing'], owner:'Legal', runs:'96', fail:'11' },
  { id:'wf_4', name:'Nightly ledger sync', status:['success','Active'], owner:'Finance ops', runs:'2,610', fail:'0' },
];
function Demo(){
  const [sel,setSel] = React.useState(['wf_2']);
  const [view,setView] = React.useState('All');
  const [q,setQ] = React.useState('');
  const rows = DATA.map(d => ({
    id: d.id,
    name: <Stack direction="inline" gap="300" align="center"><Thumbnail size="medium" /><Text fontWeight="medium">{d.name}</Text></Stack>,
    status: <Badge tone={d.status[0]}>{d.status[1]}</Badge>,
    owner: <Text tone="secondary">{d.owner}</Text>,
    runs: d.runs,
    fail: <Text tone={d.fail === '0' ? 'secondary' : 'critical'} numeric>{d.fail}</Text>,
  }));
  return (
    <Card padding="none">
      <FilterBar views={['All','Active','Failing']} selectedView={view} onSelectView={setView} searchValue={q} onSearchChange={setQ} />
      <DataTable
        selectable selectedIds={sel}
        onToggleRow={(id)=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id])}
        onToggleAll={(next)=>setSel(next?DATA.map(d=>d.id):[])}
        columns={[{key:'name',title:'Workflow'},{key:'status',title:'Status'},{key:'owner',title:'Owner'},{key:'runs',title:'Runs',align:'end'},{key:'fail',title:'Failures',align:'end'}]}
        rows={rows}
        footer={<Pagination label="1–4 of 1,044" hasNext />}
      />
    </Card>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
