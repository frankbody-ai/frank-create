<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Actions</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-bg)}.lbl{font-size:11px;line-height:12px;color:var(--color-text-disabled);min-width:64px}.row{display:flex;align-items:center;gap:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
window.AS_ICON_BASE = '../../assets/icons';
const { Button, IconButton, ButtonGroup, Box, Stack } = window.AutoSolutionsOSDesignSystem_27c955;
const Row = ({ label, children }) => (
  <div className="row"><span className="lbl">{label}</span><div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>{children}</div></div>
);
function Demo(){
  return (
    <Box background="bg-surface" padding="400" borderRadius="300" shadow="100">
      <Stack gap="300">
        <Row label="variants">
          <Button variant="primary">Add workflow</Button>
          <Button>Export</Button>
          <Button variant="tertiary">Duplicate</Button>
          <Button variant="plain">Learn more</Button>
        </Row>
        <Row label="critical">
          <Button variant="primary" tone="critical">Delete workflow</Button>
          <Button tone="critical">Deactivate</Button>
          <Button variant="tertiary" tone="critical">Remove</Button>
        </Row>
        <Row label="with icon">
          <Button icon="arrow-up-tray">Import</Button>
          <Button icon="sparkles" variant="primary">Draft with AI</Button>
          <Button disclosure>More actions</Button>
        </Row>
        <Row label="states">
          <Button loading>Saving</Button>
          <Button variant="primary" disabled>Publish</Button>
          <Button disabled>Export</Button>
        </Row>
        <Row label="sizes">
          <Button size="micro">Micro 24</Button>
          <Button>Medium 28</Button>
          <Button size="large">Large 32</Button>
        </Row>
        <Row label="icon only">
          <IconButton icon="pencil-square" label="Edit" />
          <IconButton icon="document-duplicate" label="Duplicate" />
          <IconButton icon="trash" label="Delete" tone="critical" />
          <IconButton icon="ellipsis-horizontal" label="More" variant="secondary" />
          <ButtonGroup variant="segmented">
            <Button icon="list-bullet">List</Button>
            <Button icon="table-cells" pressed>Table</Button>
          </ButtonGroup>
        </Row>
      </Stack>
    </Box>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
