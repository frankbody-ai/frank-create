<!-- @dsCard group="Components" viewport="700x300" name="Overlays" subtitle="Popover + ActionList, Modal (click to open)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Overlays</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--color-bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
window.AS_ICON_BASE = '../../assets/icons';
const { Popover, ActionList, Modal, Button, Card, Text, Stack } = window.AutoSolutionsOSDesignSystem_27c955;
function Demo(){
  const [menu,setMenu] = React.useState(true);
  const [modal,setModal] = React.useState(false);
  return (
    <Stack direction="inline" gap="400" align="start">
      <Card title="Popover + ActionList" style={{width:300}}>
        <Popover active={menu} onClose={()=>setMenu(false)}
          activator={<Button disclosure onClick={()=>setMenu(o=>!o)}>More actions</Button>}>
          <ActionList sections={[
            { items:[{content:'Duplicate',icon:'document-duplicate'},{content:'Export runs',icon:'arrow-down-tray'},{content:'Move to folder',icon:'folder'}] },
            { items:[{content:'Delete workflow',icon:'trash',destructive:true}] },
          ]} />
        </Popover>
        <div style={{height:150}} />
      </Card>
      <Card title="Modal" style={{width:300}}>
        <Text tone="secondary">Destructive confirmations name the consequence instead of asking “Are you sure”.</Text>
        <Button variant="primary" tone="critical" onClick={()=>setModal(true)}>Delete 3 workflows</Button>
      </Card>
      <Modal open={modal} size="small" title="Delete 3 workflows?" onClose={()=>setModal(false)}
        primaryAction={<Button variant="primary" tone="critical" onClick={()=>setModal(false)}>Delete workflows</Button>}
        secondaryActions={<Button onClick={()=>setModal(false)}>Cancel</Button>}>
        <Text>Their run history is kept for 30 days. This can’t be undone.</Text>
      </Modal>
    </Stack>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
